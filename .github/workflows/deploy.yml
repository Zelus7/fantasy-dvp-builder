name: Deploy private web app

on:
  workflow_dispatch:
  push:
    branches:
      - release/private-web-v1
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Inject D1 database ID
        run: |
          python - <<'PY'
          import json, os
          path = 'wrangler.jsonc'
          data = json.load(open(path))
          data['d1_databases'][0]['database_id'] = os.environ['D1_DATABASE_ID']
          json.dump(data, open(path, 'w'), indent=2)
          PY
      - run: npm run ci
      - run: npx wrangler d1 migrations apply fantasy-command-center --remote
      - run: npx wrangler deploy
