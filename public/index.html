<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a13"><meta name="description" content="Private ESPN fantasy football lineup, matchup, waiver, and trade intelligence."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"><title>Fantasy Command Center</title></head><body>
<div id="login" class="center hidden"><form id="login-form" class="card login"><div class="eyebrow">PRIVATE ACCESS</div><h1>Fantasy Command Center</h1><p>League-specific decisions—not a generic ranking page wearing shoulder pads.</p><label>Access code<input id="access-code" type="password" required autocomplete="current-password"></label><button class="primary">Open command center</button><p id="login-error" class="error"></p></form></div>
<div id="app" class="app hidden"><header><div><div class="eyebrow">FANTASY INTELLIGENCE</div><h1>Command Center</h1></div><div class="header-actions"><select id="league"></select><button id="refresh">Refresh</button></div></header><nav id="tabs"><button data-view="dashboard" class="active">Dashboard</button><button data-view="lineup">Lineup</button><button data-view="matchups">Matchups</button><button data-view="compare">Compare</button><button data-view="waivers">Waivers</button><button data-view="trades">Trades</button><button data-view="settings">Settings</button></nav><main>${['dashboard','lineup','matchups','compare','waivers','trades','settings'].map(v=>`<section id="view-${v}" class="view${v==='dashboard'?'':' hidden'}"></section>`).join('')}</main><div id="toast" class="toast hidden"></div></div>
<script type="module" src="/app.js"></script></body></html>
