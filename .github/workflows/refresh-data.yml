name: Refresh NFL intelligence data

on:
  schedule:
    # Public feeds publish asynchronously; poll through stat corrections too.
    - cron: "33 */6 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: Optional NFL season override
        required: false
      through_week:
        description: Optional through-week override
        required: false

permissions:
  contents: read

concurrency:
  group: nfl-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      DATA_INGEST_TOKEN: ${{ secrets.DATA_INGEST_TOKEN }}
    steps:
      - name: Check refresh configuration
        id: preflight
        shell: bash
        run: |
          if [[ -z "${APP_BASE_URL:-}" || -z "${DATA_INGEST_TOKEN:-}" ]]; then
            echo '::error::NFL data refresh requires APP_BASE_URL and DATA_INGEST_TOKEN.'
            exit 1
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.preflight.outputs.ready == 'true'
        with:
          # Registration may live on main while the private app remains on its
          # explicitly approved development branch. Do not merge the app here.
          ref: codex/deploy-private-v1

      - uses: actions/setup-python@v6
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -r pipeline/requirements.txt

      - name: Build and publish datasets
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        env:
          REQUESTED_SEASON: ${{ inputs.season }}
          REQUESTED_WEEK: ${{ inputs.through_week }}
        run: |
          args=()
          if [[ -n "${REQUESTED_SEASON}" ]]; then
            [[ "${REQUESTED_SEASON}" =~ ^[0-9]{4}$ ]] || exit 1
            args+=(--season "${REQUESTED_SEASON}")
          fi
          if [[ -n "${REQUESTED_WEEK}" ]]; then
            [[ "${REQUESTED_WEEK}" =~ ^([1-9]|1[0-8])$ ]] || exit 1
            args+=(--through-week "${REQUESTED_WEEK}")
          fi
          python pipeline/build_datasets.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.preflight.outputs.ready == 'true'
        with:
          name: nfl-intelligence-${{ github.run_id }}
          path: pipeline/output/
          if-no-files-found: ignore
          retention-days: 14
