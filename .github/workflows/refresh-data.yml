name: Refresh NFL intelligence data

on:
  schedule:
    - cron: "30 10 * * TUE"
    - cron: "30 12 * * SUN"
  workflow_dispatch:
    inputs:
      season:
        description: Optional NFL season override
        required: false
      through_week:
        description: Optional through-week override
        required: false

permissions:
  contents: read

concurrency:
  group: nfl-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      DATA_INGEST_TOKEN: ${{ secrets.DATA_INGEST_TOKEN }}
    steps:
      - name: Check refresh configuration
        id: preflight
        shell: bash
        run: |
          if [[ -z "${APP_BASE_URL:-}" || -z "${DATA_INGEST_TOKEN:-}" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::NFL data refresh skipped because APP_BASE_URL or DATA_INGEST_TOKEN is not configured.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.preflight.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -r pipeline/requirements.txt

      - name: Build and publish datasets
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.season }}" ]]; then args+=(--season "${{ inputs.season }}"); fi
          if [[ -n "${{ inputs.through_week }}" ]]; then args+=(--through-week "${{ inputs.through_week }}"); fi
          python pipeline/build_datasets.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.preflight.outputs.ready == 'true'
        with:
          name: nfl-intelligence-${{ github.run_id }}
          path: pipeline/output/
          if-no-files-found: ignore
          retention-days: 14
