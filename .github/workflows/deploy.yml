name: Deploy private web app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      APP_ACCESS_CODE: ${{ secrets.APP_ACCESS_CODE }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      DATA_INGEST_TOKEN: ${{ secrets.DATA_INGEST_TOKEN }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate required deployment secrets
        shell: bash
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            D1_DATABASE_ID \
            APP_ACCESS_CODE \
            SESSION_SECRET \
            CREDENTIAL_ENCRYPTION_KEY \
            DATA_INGEST_TOKEN; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - run: npm install

      - name: Inject D1 database ID
        run: |
          python - <<'PY'
          import json, os
          path = 'wrangler.jsonc'
          with open(path, encoding='utf-8') as source:
              data = json.load(source)
          data['d1_databases'][0]['database_id'] = os.environ['D1_DATABASE_ID']
          with open(path, 'w', encoding='utf-8') as target:
              json.dump(data, target, indent=2)
              target.write('\n')
          PY

      - run: npm run ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and PWA with runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/fantasy-command-center-secrets.json"
          deploy_log="$RUNNER_TEMP/fantasy-command-center-deploy.log"
          trap 'rm -f "$secrets_file" "$deploy_log"' EXIT
          python - <<'PY'
          import json, os
          required = [
              'APP_ACCESS_CODE',
              'SESSION_SECRET',
              'CREDENTIAL_ENCRYPTION_KEY',
              'DATA_INGEST_TOKEN',
          ]
          payload = {name: os.environ[name] for name in required}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'fantasy-command-center-secrets.json'), 'w', encoding='utf-8') as target:
              json.dump(payload, target)
          PY
          chmod 600 "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" | tee "$deploy_log"
          worker_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$deploy_log" | tail -1 || true)"
          if [[ -n "$worker_url" ]]; then
            printf '### Deployment\n\n%s\n' "$worker_url" >> "$GITHUB_STEP_SUMMARY"
          fi
