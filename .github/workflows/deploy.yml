name: Deploy private web app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 3cc20c2dc4ee5898413c75d56bced9c8
      APP_BASE_URL: https://fantasy-command-center.acarvall87.workers.dev

    steps:
      - name: Validate deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN in the GitHub production environment. Keep existing app secrets in Cloudflare; do not rotate them for deployment.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - run: npm ci
      - run: npm run ci

      - name: Verify existing Worker secrets before migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json | node scripts/deployment-checks.mjs secrets

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and PWA preserving existing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify production health and private API boundary
        run: node scripts/deployment-checks.mjs smoke "$APP_BASE_URL"

      - name: Summarize verified deployment
        shell: bash
        run: |
          set -euo pipefail
          printf '### Verified deployment\n\nApp: %s\n\nCommit: %s\n\nHealth, database readiness, and unauthenticated API checks passed. Existing Worker secrets were preserved.\n\nAuthenticated login and ESPN roster refresh still require a signed-in browser check.\n' "$APP_BASE_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
