<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>ESPN Connector</title></head><body><main><div class="eyebrow">PRIVATE CONNECTOR</div><h1>ESPN connection</h1><p id="status">Checking status…</p><section id="pairing"><label>App URL<input id="app-url" type="url" placeholder="https://your-app.workers.dev"></label><label>Pairing code<input id="pairing-code" maxlength="8" placeholder="ABCDEFGH"></label><label>Browser name<input id="device-name" maxlength="100" placeholder="Alex's Chrome"></label><button id="pair">Pair browser</button></section><section id="connected" class="hidden"><button id="sync">Sync ESPN now</button><button id="open" class="secondary">Open app</button><button id="disconnect" class="danger">Disconnect</button></section><p class="fine">This extension reads only <code>SWID</code> and <code>espn_s2</code>. It never receives your ESPN password.</p><p id="error" class="error"></p></main><script type="module" src="popup.js"></script></body></html>
